name = "caffi-checkin-bot"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# The Caffi API is a single VNPT address in Vietnam (222.255.215.152), not
# anycast, so Cloudflare can triangulate it. Placement Matters here: without it
# the isolate sits nearest whoever woke it up — `ord`/`ams` measured ~265ms to
# Vietnam, which is larger than the whole midnight race. Placed, the isolate
# runs in the colo closest to the Caffi servers.
#
# Placement only applies to *fetch* handlers, so the cron handler runs unplaced
# and races from there; `/race` (an external scheduler such as cron-job.com) is
# the placed path, and the shorter round trip makes its knock loop tighter.
[placement]
hostname = "client-api.caffiliate.vn"

[[d1_databases]]
binding = "caffi"
database_name = "caffi"
database_id = "81920473-d963-4062-9c41-3319364d3de4"

# Two triggers, both in UTC (Vietnam is UTC+7 all year).
#
# `56 16 * * *` (23:56 VN) is the race. It fires three minutes early because
# cron has minute resolution and every scheduler measured so far is late by
# tens of seconds — Cloudflare by ~28s, cron-job.org by up to 64s, which is
# what put two nights of check-ins at 00:01. The handler warms the
# connections, naps the 235 seconds, and only then polls for the flip: a cron
# invocation may run 15 minutes of wall time and sleeping costs no CPU. The
# lead is what makes the jitter free instead of fatal.
#
# `28 17 * * *` (00:28 VN) is the net: it only runs when the race has not
# finished (`tick(true)`), which is the "a run started but never completed"
# case.
[triggers]
crons = ["56 16 * * *", "28 17 * * *"]

# Non-secret configuration. Anything sensitive (BOT_SECRET, the Telegram and
# Discord tokens) goes in `wrangler secret put`.
[vars]
RUNTIME_MODE = "worker"
CHECKIN_HOUR = "0"
CHECKIN_MINUTE = "0"
CHECKIN_EARLY_SECONDS = "5"
CHECKIN_MAX_WAIT_SECONDS = "600"
DATA_DIR = "data"
KDF_ITERATIONS = "1000"
